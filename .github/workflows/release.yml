name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0 or 1.0.0-preview.1)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '${{ inputs.version }}'. Expected e.g. 1.0.0 or 1.0.0-preview.1"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ inputs.version }}
      - name: Pack
        run: dotnet pack -c Release --no-build -p:Version=${{ inputs.version }} -o artifacts
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" artifacts/*.nupkg --title "v${{ inputs.version }}" --generate-notes
